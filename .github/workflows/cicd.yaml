name: CI/CD GOTA

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: steam-canto-506904-r0
  REGION: europe-west1
  SERVICE_NAME: gota
  REPOSITORY: gota
  IMAGE_NAME: gota-app
  CLOUD_SQL_INSTANCE: pelagic-radio-506904-n9:us-central1:gota-db

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli, pdo_mysql
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar pruebas
        run: composer test

  deploy:
    name: Deploy Cloud Run
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Configurar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Crear repositorio Artifact Registry si no existe
        run: |
          gcloud artifacts repositories describe "${{ env.REPOSITORY }}" \
            --location="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
          || gcloud artifacts repositories create "${{ env.REPOSITORY }}" \
            --repository-format=docker \
            --location="${{ env.REGION }}" \
            --description="Imagen Docker de GOTA" \
            --project="${{ env.PROJECT_ID }}"

      - name: Construir y publicar imagen
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Desplegar en Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image="$IMAGE" \
            --region="${{ env.REGION }}" \
            --platform=managed \
            --allow-unauthenticated \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=20 \
            --timeout=60 \
            --min-instances=0 \
            --max-instances=2 \
            --add-cloudsql-instances="${{ env.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars="CI_ENVIRONMENT=production,app.baseURL=${{ secrets.APP_BASE_URL }},database.default.hostname=${{ secrets.DB_HOST }},database.default.database=${{ secrets.DB_NAME }},database.default.username=${{ secrets.DB_USER }},database.default.password=${{ secrets.DB_PASSWORD }},database.default.DBDriver=MySQLi,database.default.port=3306,encryption.key=${{ secrets.ENCRYPTION_KEY }}"
